version: '3.9'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 15s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_pass
      POSTGRES_DB: user_service
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ride -d user_service
      interval: 5s
      retries: 5

  driver-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_pass
      POSTGRES_DB: driver_service
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready -U ride -d driver_service
      interval: 5s
      retries: 5

  trip-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_pass
      POSTGRES_DB: trip_service
    ports:
      - "5434:5432"
    healthcheck:
      test: pg_isready -U ride -d trip_service
      interval: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_pass
      POSTGRES_DB: notification_service
    ports:
      - "5435:5432"
    healthcheck:
      test: pg_isready -U ride -d notification_service
      interval: 5s
      retries: 5
