syntax = "proto3";

package driver;

service DriverService {
  rpc CreateDriver (CreateDriverRequest) returns (DriverResponse);
  rpc GetDriver (GetDriverRequest) returns (DriverResponse);
  rpc UpdateDriverLocation (UpdateDriverLocationRequest) returns (LocationResponse);
  rpc ToggleAvailability (ToggleAvailabilityRequest) returns (DriverResponse);
  rpc FindNearbyDrivers (FindNearbyDriversRequest) returns (NearbyDriversResponse);
}

message CreateDriverRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  VehicleInfo vehicle = 6;
}

message VehicleInfo {
  string make = 1;
  string model = 2;
  int32 year = 3;
  string color = 4;
  string license_plate = 5;
  int32 capacity = 6;
}

message GetDriverRequest {
  string id = 1;
}

message UpdateDriverLocationRequest {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double heading = 4;
  double speed = 5;
}

message ToggleAvailabilityRequest {
  string driver_id = 1;
  bool is_available = 2;
}

message FindNearbyDriversRequest {
  double latitude = 1;
  double longitude = 2;
  double radius_km = 3;
  string ride_type = 4;
}

message DriverResponse {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string status = 7;
  double rating = 8;
  int32 total_trips = 9;
  bool is_verified = 10;
  VehicleInfo vehicle = 11;
  string created_at = 12;
  string updated_at = 13;
}

message LocationResponse {
  bool success = 1;
}

message NearbyDriversResponse {
  repeated NearbyDriver drivers = 1;
}

message NearbyDriver {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double distance_km = 4;
  double rating = 5;
  VehicleInfo vehicle = 6;
}